appId: com.library.mobile
name: Face Capture Flow
description: Test face registration using AutoFaceCapture component

startApp:
    clearState: true

steps:
  - launchApp:
      clearState: true

  - assertVisible:
      text: "Đăng nhập"
      timeout: 10000

  - tapOn:
      placeholder: "Mã số sinh viên"

  - inputText:
      text: "TEST001"

  - tapOn:
      placeholder: "Mật khẩu"

  - inputText:
      text: "password123"

  - tapOn:
      text: "Đăng nhập"

  - waitForNavigation:
      timeout: 15000

  - tapOn:
      id: "profile-tab"

  - waitForNavigation:
      timeout: 5000

  - tapOn:
      text: "Đăng ký khuôn mặt"
      timeout: 5000

  - waitForNavigation:
      timeout: 5000

  - assertVisible:
      text: "Đăng ký khuôn mặt"
      timeout: 5000

  - waitFor:
      condition: "Camera active"
      timeout: 5000

  - assertVisible:
      text: "Đưa khuôn mặt vào khung"
      timeout: 3000

  - waitFor:
      condition: "Face detected"
      timeout: 10000

  - assertVisible:
      text: "Giữ nguyên..."
      timeout: 3000

  - waitFor:
      condition: "Countdown started"
      timeout: 5000

  - assertVisible:
      text: "3"
      timeout: 3000

  - waitFor:
      condition: "Photo captured"
      timeout: 5000

  - assertVisible:
      text: "Đăng ký thành công"
      timeout: 10000

