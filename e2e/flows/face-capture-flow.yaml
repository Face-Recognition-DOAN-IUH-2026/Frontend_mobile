---

name: Face Capture Flow - Multiple Angles
appId: com.library.mobile

steps:
  - launchApp:
      clearState: true

  - assertVisible:
      text: "Đăng nhập"
      timeout: 10000

  - tapOn:
      placeholder: "Mã số sinh viên"

  - inputText:
      text: "TEST001"

  - tapOn:
      placeholder: "Mật khẩu"

  - inputText:
      text: "password123"

  - tapOn:
      text: "Đăng nhập"

  - waitForNavigation:
      timeout: 15000

  - tapOn:
      id: "profile-tab"

  - tapOn:
      text: "Đăng ký khuôn mặt 4 góc"

  - waitForNavigation:
      timeout: 5000

  - assertVisible:
      text: "Chụp ảnh 4 góc"
      timeout: 5000

  - tapOn:
      text: "Góc 1: Chính diện"
      timeout: 3000

  - waitFor:
      condition: "Camera ready"
      timeout: 5000

  - tapOn:
      id: "capture"

  - waitFor:
      condition: "Frontal captured"
      timeout: 5000

  - tapOn:
      text: "Góc 2: Nhìn phải"
      timeout: 3000

  - tapOn:
      id: "capture"

  - waitFor:
      condition: "Right captured"
      timeout: 5000

  - tapOn:
      text: "Góc 3: Nhìn trái"
      timeout: 3000

  - tapOn:
      id: "capture"

  - waitFor:
      condition: "Left captured"
      timeout: 5000

  - tapOn:
      text: "Góc 4: Nhìn xuống"
      timeout: 3000

  - tapOn:
      id: "capture"

  - waitFor:
      condition: "Down captured"
      timeout: 5000

  - tapOn:
      text: "Hoàn tất"
      timeout: 3000

  - waitFor:
      timeout: 10000

  - assertVisible:
      text: "Đăng ký hoàn tất"
      timeout: 8000