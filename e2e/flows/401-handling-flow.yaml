name: 401 Handling - Token Refresh Fails
appId: com.library.mobile

steps:
  - launchApp:
      clearState: true

  - assertVisible:
      text: "Đăng nhập"
      timeout: 10000

  - tapOn:
      placeholder: "Mã số sinh viên"

  - inputText:
      text: "TEST001"

  - tapOn:
      placeholder: "Mật khẩu"

  - inputText:
      text: "password123"

  - tapOn:
      text: "Đăng nhập"

  - waitForNavigation:
      timeout: 15000

  - clearKeychain:
      removeKeys:
        - "refreshToken"

  - tapOn:
      id: "borrow-tab"

  - waitFor:
      condition: "Refresh token fails"
      timeout: 5000

  - waitForNavigation:
      timeout: 10000

  - assertVisible:
      text: "Đăng nhập"
      timeout: 8000

  - assertVisible:
      text: "Phiên đăng nhập hết hạn"
      timeout: 5000