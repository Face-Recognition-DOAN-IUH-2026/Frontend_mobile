appId: com.library.mobile
name: Borrow Book Flow
description: Test borrowing a book by scanning barcode

steps:
  - launchApp:
      clearState: true

  - assertVisible:
      text: "Đăng nhập"
      timeout: 10000

  - tapOn:
      placeholder: "Mã sinh viên"

  - inputText:
      text: "TEST001"

  - tapOn:
      placeholder: "Mật khẩu"

  - inputText:
      text: "password123"

  - tapOn:
      text: "Đăng nhập"

  - waitForNavigation:
      timeout: 15000

  - tapOn:
      text: "Mượn sách"
      timeout: 5000

  - waitForNavigation:
      timeout: 5000

  - assertVisible:
      text: "Đặt mã vạch trong khung hình"
      timeout: 5000

  - tapOn:
      text: "Hoặc nhập ISBN thủ công"
      timeout: 3000

  - inputText:
      text: "9780134685991"

  - tapOn:
      icon: "magnify"
      timeout: 3000

  - waitFor:
      condition: "Book found"
      timeout: 10000

  - assertVisible:
      text: "Xác nhận mượn"
      timeout: 5000

  - tapOn:
      testId: "confirm-borrow-button"
      timeout: 5000

  - waitFor:
      timeout: 10000

  - assertVisible:
      text: "Mượn sách thành công"
      timeout: 8000

